<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material Media Effect Tool</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=20261112h">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mp4-muxer": "https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs"
  }
}
</script>
</head>
<body>
<div class="window">
  <header class="titlebar">
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="title">Material Media Effect Tool</div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ko">KO</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>
  <div class="body">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="stage-area">
      <div class="stage-top">
        <button type="button" id="playBtn" class="icon-btn" aria-label="Pause">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect id="pIcon1" x="3" y="2" width="3.5" height="12" fill="currentColor"/><rect id="pIcon2" x="9.5" y="2" width="3.5" height="12" fill="currentColor"/><path id="playIcon" d="M4 2 L14 8 L4 14 Z" fill="currentColor" style="display:none"/></svg>
        </button>
        <button type="button" id="replayBtn" class="text-btn" data-i18n="replay">Replay</button>
      </div>
      <div class="stage" id="stage">
        <canvas id="canvas"></canvas>
        <div class="empty" id="empty"><div><p class="empty-title" data-i18n="emptyTitle"></p><p class="empty-body" data-i18n="emptyBody"></p></div></div>
      </div>
      <div class="keys" data-i18n="keys"></div>
    </main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="script.js?v=20261112h"></script>
</body>
</html>
